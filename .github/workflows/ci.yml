name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the Playwright end-to-end suite"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Uses the version pinned in package.json ("packageManager").

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/trustcenter_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # vitest.config.mts points at trustcenter_test on 127.0.0.1:5432; its global
        # setup creates the database (psql) and applies migrations.
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/trustcenter_test

      - name: Production build
        # `next build` imports server modules while collecting route metadata, so the
        # environment must pass src/lib/env.ts validation. These are placeholders.
        run: pnpm exec next build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          SESSION_SECRET: ci-placeholder-session-secret-not-used-anywhere
          ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
          STORAGE_DRIVER: local

  e2e:
    name: End-to-end tests (Playwright)
    # Opt-in for now: run via "Run workflow" with the e2e checkbox. To make it
    # mandatory, replace the condition with `if: true` (or remove it).
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/trustcenter_e2e
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
